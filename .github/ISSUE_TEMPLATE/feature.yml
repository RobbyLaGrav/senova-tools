name: Idea or feature
description: Suggest an improvement or a new tool.
labels: [enhancement]
body:
  - type: input
    id: tool
    attributes:
      label: Tool (or "new tool")
    validations: { required: true }
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: Your idea
