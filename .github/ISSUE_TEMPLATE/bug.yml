name: Bug report
description: Something in a tool doesn't work as documented.
labels: [bug]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options: [Seedrun, Smoothchart, Typeset, Honest, Spikesim, Quant8, Overflow, Renderpack, Diskguard, Probe, Bench, Unfold, Rewind, Repository]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest code or commands that show the problem.
      render: shell
    validations: { required: true }
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "tool 0.1.0, Node 24.19.0, Windows 11"
